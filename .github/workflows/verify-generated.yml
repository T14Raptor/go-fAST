name: Verify generated code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-generated:
    name: Verify generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The generators read ./ast and write ast/*.go relative to the repo
      # root, so they must be invoked from the root (not via `go generate`,
      # which would run them from the ast/ package directory).
      - name: Regenerate
        run: |
          go run ast/gen_union.go
          go run ast/gen_visit.go
          go run ast/gen_clone.go

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- ast/union.go ast/visit.go ast/clone.go; then
            echo "::error::Generated files are out of date. From the repo root run 'go run ast/gen_union.go && go run ast/gen_visit.go && go run ast/gen_clone.go' and commit ast/union.go, ast/visit.go and ast/clone.go."
            exit 1
          fi
